version: '3.8'

services:
  # ==========================================================
  # 1. PostgreSQL Database (Customer Timeline & RBAC Storage)
  # ==========================================================
  postgres:
    image: postgres:15-alpine
    container_name: hackqubit_postgres
    restart: always
    environment:
      POSTGRES_DB: hackqubit_crm
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_password_2024
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d hackqubit_crm"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================================
  # 2. Redis (Real-time caching & Socket presence)
  # ==========================================================
  redis:
    image: redis:7-alpine
    container_name: hackqubit_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  # ==========================================================
  # 3. MinIO Object Storage (Persistent Voice Call Recordings)
  # ==========================================================
  minio:
    image: minio/minio:RELEASE.2023-09-23T03-47-50Z
    container_name: hackqubit_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"     # MinIO S3 API
      - "9001:9001"     # MinIO Web Console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================
  # 4. MinIO Bucket Initializer (Automated provisioning)
  # ==========================================================
  minio-init:
    image: minio/mc:RELEASE.2023-09-20T21-41-34Z
    container_name: hackqubit_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin123;
      /usr/bin/mc mb -p myminio/call-recordings;
      /usr/bin/mc mb -p myminio/attachments;
      /usr/bin/mc anonymous set download myminio/call-recordings;
      exit 0;
      "

  # ==========================================================
  # 5. Full-Stack CRM Backend API & Webhook Ingestion Engine
  # ==========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hackqubit_backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      JWT_SECRET: hackqubit_super_secret_jwt_key_2024_change_in_prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: hackqubit_crm
      DB_USER: crm_user
      DB_PASSWORD: crm_password_2024
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET_RECORDINGS: call-recordings
      MINIO_BUCKET_ATTACHMENTS: attachments
      MINIO_USE_SSL: "false"
      FRONTEND_URL: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ==========================================================
  # 6. React Front-End CRM Interface (Nginx Reverse Proxy)
  # ==========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hackqubit_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
    driver: local
  miniodata:
    driver: local
  redisdata:
    driver: local
