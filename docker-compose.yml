# ==========================================================
# HackQubit CRM - Production Docker Compose
#
# BEFORE STARTING: Copy backend/.env and fill in ALL secrets.
# Do NOT commit .env files to version control.
# ==========================================================

services:
  # ==========================================================
  # 1. PostgreSQL Database (Customer Timeline & RBAC Storage)
  # ==========================================================
  postgres:
    image: postgres:15-alpine
    container_name: hackqubit_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================================
  # 2. Redis (Real-time caching & Socket presence)
  # ==========================================================
  redis:
    image: redis:7-alpine
    container_name: hackqubit_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme_redis_password}
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  # ==========================================================
  # 3. S3-compatible object storage (Persistent Voice Call Recordings)
  # ==========================================================
  minio:
    image: rustfs/rustfs:latest
    container_name: hackqubit_rustfs
    restart: always
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${MINIO_SECRET_KEY}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"     # MinIO S3 API
      - "9001:9001"     # MinIO Web Console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================
  # 4. Full-Stack CRM Backend API & Webhook Ingestion Engine
  # ==========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hackqubit_backend
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ==========================================================
  # 6. React Front-End CRM Interface (Nginx Reverse Proxy)
  # ==========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hackqubit_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
    driver: local
  miniodata:
    driver: local
  redisdata:
    driver: local
